apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: application
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: applications.platform.kisracorp.com
    spec:
      group: platform.kisracorp.com
      scope: Namespaced
      names:
        kind: Application
        plural: applications
        singular: application
      versions:
        - name: v1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              properties:
                spec:
                  type: object
                  required: [team]
                  properties:
                    team:
                      type: string
                    environment:
                      type: string
                      enum: [dev, staging, prod]
                    costCenter:
                      type: string
                    requestId:
                      type: string
                    approvedBy:
                      type: string
                    # Stamped by the Backstage action from the AUTHENTICATED user.
                    requestedBy:
                      type: string
                    requesterTeams:
                      type: array
                      items:
                        type: string
                    requesterIsAdmin:
                      type: boolean
                    # Built as an EC2Instance and an S3Bucket request of their own.
                    compute:
                      type: object
                      required: [size, exposure]
                      properties:
                        size:
                          type: string
                          enum: [small, medium]
                        exposure:
                          type: string
                          enum: [none, internal, internet-facing]
                    storage:
                      type: boolean
                    # Built by this Promise's own pipeline.
                    database:
                      type: object
                      required: [engine, size]
                      properties:
                        engine:
                          type: string
                          enum: [postgres, mysql]
                        size:
                          type: string
                          enum: [small, medium]
                    cache:
                      type: object
                      required: [size]
                      properties:
                        size:
                          type: string
                          enum: [small, medium]
                    table:
                      type: boolean
                    https:
                      type: boolean
                    waf:
                      type: boolean
                    monitoring:
                      type: object
                      required: [retentionDays]
                      properties:
                        retentionDays:
                          type: integer
                          enum: [7, 30, 90, 365]
                    backup:
                      type: object
                      required: [retentionDays]
                      properties:
                        retentionDays:
                          type: integer
                          enum: [7, 14, 35]
  workflows:
    resource:
      configure:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: create
          spec:
            containers:
              - name: opa-check
                image: mikefarah/yq:4
                command: ["sh", "-c"]
                args:
                  - |
                    set -eu
                    IN=/kratix/input/object.yaml
                    REQUEST=$(yq -o=json -I=0 '.' "$IN")
                    RID=$(yq '.spec.requestId // ""' "$IN")
                    RESPONSE=$(wget -qO- --header 'Content-Type: application/json' \
                      --post-data "{\"input\": $REQUEST}" \
                      http://opa.opa-system.svc:8181/v1/data/application/decision)
                    RESULT=$(echo "$RESPONSE" | yq -p=json '.result.result')
                    REASONS=$(echo "$RESPONSE" | yq -p=json '.result.reasons | join("; ")')
                    DATA_COST=$(echo "$RESPONSE" | yq -p=json '.result.data_cost // 0')
                    TOTAL=$(echo "$RESPONSE" | yq -p=json '.result.total // 0')
                    echo "OPA said: $RESULT ${REASONS}"
                    case "$RESULT" in
                      allow)    MSG="Policy OK" ;;
                      approval) MSG="WAITING FOR APPROVAL: $REASONS" ;;
                      *)        RESULT=deny; MSG="DENIED: $REASONS" ;;
                    esac
                    cat > /kratix/metadata/status.yaml <<EOF
                    decision: "$RESULT"
                    message: "$MSG"
                    requestId: "$RID"
                    dataCost: "$DATA_COST"
                    totalCost: "$TOTAL"
                    EOF
              - name: tofu-app
                image: tofu-pipeline:dev
                command: ["/scripts/app-apply.sh"]
                envFrom:
                  - secretRef:
                      name: aws-creds
                resources:
                  requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
                  limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
      delete:
        - apiVersion: platform.kratix.io/v1alpha1
          kind: Pipeline
          metadata:
            name: delete
          spec:
            containers:
              - name: tofu-destroy
                image: tofu-pipeline:dev
                command: ["/scripts/app-destroy.sh"]
                envFrom:
                  - secretRef:
                      name: aws-creds
                resources:
                  requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 256Mi }
                  limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
